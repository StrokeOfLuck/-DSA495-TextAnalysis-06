name: Generate BERTopic visuals

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-bertopic-visuals.yml"
      - "scripts/export_notebook_visuals.py"
      - "data/news_category_2022.csv"

permissions:
  contents: write

jobs:
  build-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "bertopic==0.17.4" "sentence-transformers>=3,<7" "pandas>=2.2,<3" "plotly>=6,<8" hdbscan umap-learn scikit-learn torch nbconvert nbformat "kaleido==0.2.1"

      - name: Execute notebook with outputs
        run: |
          jupyter nbconvert --to notebook --execute --inplace DSA495-M06-Topic-Modeling.ipynb --ExecutePreprocessor.timeout=1800

      - name: Export real Plotly charts
        run: python scripts/export_notebook_visuals.py

      - name: Commit executed notebook and visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DSA495-M06-Topic-Modeling.ipynb generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate executed BERTopic notebook and visuals"
            git push
          fi
